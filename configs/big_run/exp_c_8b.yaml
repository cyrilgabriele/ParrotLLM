# Full pretraining run on Dataset C — 8 GPU cluster, 8B token budget, 4 epochs max
# Architecture: locked from staged 8.75M → 17.5M → 40M architecture search
# HPs: adjusted from Trial #70 after stagnation at step 24.5k (best loss 3.4510)
# Changes: lower LR (2.63e-3→1.5e-3), more patience (5→15), cosine schedule (was wsd), more dropout (0.013→0.03)
# Batch remapped for 8x V100: bs=32, ga=1 preserves the Optuna winner's
# effective batch of 256 sequences/update (single-GPU proxy used bs=64, ga=4).
# Run with: torchrun --nproc_per_node=8 main.py --stage train --config configs/big_run/exp_c_8b.yaml

model:
  vocab_size: 50258
  pad_token_id: 50257
  bos_token_id: 50256
  eos_token_id: 50256
  d_model: 384
  n_layers: 14
  n_heads: 6
  d_ff: 768
  context_length: 1024
  bias: false
  dropout: 0.03
  rope_theta: 10000.0
  gradient_checkpointing: false

training:
  device: auto
  train_bin: data/filter_c/train.bin
  val_bin: data/filter_c/val.bin
  num_workers: 0
  pin_memory: true

  # ── Cluster batching ──────────────────────────────────────────────────────
  # 8 GPUs × bs=32 × ga=1 × ctx=1024 = 262,144 tokens / optimizer step
  # Effective global batch = 32 × 8 × 1 = 256 sequences
  batch_size: 32
  gradient_accumulation_steps: 1

  train_samples_per_epoch: null   # null = all sliding-window starts (n_tokens - context_length)
  val_sequence_stride: null       # null = context_length // 2; sliding-window evaluation


  # ── 8B token budget, 4 epochs max ─────────────────────────────────────────
  # 8,000,000,000 tokens / 262,144 tokens-per-step ≈ 30,518 steps/epoch
  # 4 epochs ≈ 122,070 steps
  max_steps: 122070

  # ── Hyperparameters (40M Optuna HP Tuning C, Trial #70) ────────────────────
  learning_rate: 1.5e-3
  min_lr: 1.5e-4
  weight_decay: 0.13113982116099054
  beta1: 0.9
  beta2: 0.9606057712410854
  grad_clip: 0.9147944011374611

  warmup_steps: 1500              # ~5% of first epoch
  lr_schedule: cosine
  lr_decay_ratio: 0.0
  z_loss_coeff: 1.3887413811122497e-4

  compile: true
  save_every: 2500
  eval_every: 500
  checkpoint_dir: checkpoints
  keep_last_checkpoints: 10
  keep_best_checkpoints: 10
  early_stopping_patience: 15     # stop after 15 evals (7500 steps) without improvement
  early_stopping_min_delta: 0.001

  runs_dir: runs/big_run/exp_c_8b
  log_every: 10

  hf_upload:
    repo_id: ParrotLabs/Preprocessed
    repo_type: dataset
    # path_in_repo: ""
    # private: true

logging:
  console_level: INFO
  file_level: DEBUG
  components:
    data_preprocessing: DEBUG
    model_initialization: INFO
    training: INFO

eval:
  device: auto
  batch_size: 32
  max_sequences: 512
  datasets:
    - name: wikitext
      path: wikitext
      subset: wikitext-103-raw-v1
      split: test
    - name: exp_c_val
      path: data/filter_c/val.bin
