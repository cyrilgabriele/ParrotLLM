# DPO v4 — length normalisation + lower LR + tighter stop.
#
# v3 finding: length_normalize_logp=true fixed the val anomaly (val_acc
# 0.99 -> 0.92, val_loss 0.018 -> 0.60 = true preference signal) but
# inflated CF cost from +0.5% (v2) to +12.5% on WT-103, triggering the
# CF tripwire at step 120. Reason: per-pair logp is now scaled by 1/N,
# so the model can no longer satisfy the loss by exploiting length and
# must genuinely move parameters — paying a perplexity cost.
#
# Hypothesis: combining length normalisation with a lower LR and an
# earlier stop will preserve the corrected preference signal while
# keeping CF cost in the same band as v2.
#
# Variables changed from dpo_v3_length_norm:
#   - learning_rate: 5e-6 -> 1e-6 (5x lower; smaller per-step parameter
#     updates given the genuinely-nonzero loss)
#   - wt103_hard_stop_pct: 10.0 -> 5.0 (stop earlier on CF onset)
# All other hyperparameters identical to v3 (which was identical to v2
# except length_normalize_logp).

model:
  vocab_size: 50258
  pad_token_id: 50257
  bos_token_id: 50256
  eos_token_id: 50256
  d_model: 384
  n_layers: 14
  n_heads: 6
  d_ff: 768
  context_length: 1024
  bias: false
  dropout: 0.0
  rope_theta: 10000.0
  gradient_checkpointing: false

logging:
  console_level: INFO
  file_level: INFO

dpo:
  hf_dataset_name: Intel/orca_dpo_pairs
  hf_split: train
  max_examples: null
  val_fraction: 0.05
  decontam_benchmarks:
    - lambada
    - hellaswag
    - winogrande
    - openbookqa

  max_length: 1024

  beta: 0.2
  length_normalize_logp: true     # kept from v3

  learning_rate: 1.0e-6           # CHANGED — was 5.0e-6
  min_lr: 1.0e-7
  weight_decay: 0.0
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0

  warmup_steps: 10
  epochs: 1
  lr_schedule: cosine

  batch_size: 4
  gradient_accumulation_steps: 8
  num_workers: 0
  pin_memory: true

  wt103_eval_every_n_evals: 1
  wt103_max_sequences: 64
  wt103_hard_stop_pct: 5.0        # CHANGED — was 10.0; tighter CF tripwire

  runs_dir: runs
  eval_every: 20
  save_every: 999999
  log_every: 10
  early_stopping_patience: 2

  # Stack improvements: SFT v3 (pretraining_mix=0.20) is the better base.
  # WT-103 baseline at SFT v3: 85.34 (vs SFT v2's 91.19) — much smaller CF debt
  # going into DPO, so the +5% tripwire is more lenient relative to v3-baseline.
  base_checkpoint: runs/run_20260427_214613_sft/checkpoints/best_step_0001500_epoch_01_valloss_2p7318.pt
  device: auto
  torch_compile: true
