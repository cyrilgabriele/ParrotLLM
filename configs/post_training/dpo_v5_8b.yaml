# DPO v5 — same as dpo_v4 (length-norm + low-LR + tighter tripwire) but
# applied to SFT v5 (the 8B-base SFT). base_checkpoint is filled in by
# tools/overnight_pipeline.py once SFT v5 finishes.

model:
  vocab_size: 50258
  pad_token_id: 50257
  bos_token_id: 50256
  eos_token_id: 50256
  d_model: 384
  n_layers: 14
  n_heads: 6
  d_ff: 768
  context_length: 1024
  bias: false
  dropout: 0.0
  rope_theta: 10000.0
  gradient_checkpointing: false

logging:
  console_level: INFO
  file_level: INFO

dpo:
  hf_dataset_name: Intel/orca_dpo_pairs
  hf_split: train
  max_examples: null
  val_fraction: 0.05
  decontam_benchmarks:
    - lambada
    - hellaswag
    - winogrande
    - openbookqa

  max_length: 1024

  beta: 0.2
  length_normalize_logp: true

  learning_rate: 1.0e-6
  min_lr: 1.0e-7
  weight_decay: 0.0
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0

  warmup_steps: 10
  epochs: 1
  lr_schedule: cosine

  batch_size: 4
  gradient_accumulation_steps: 8
  num_workers: 0
  pin_memory: true

  wt103_eval_every_n_evals: 1
  wt103_max_sequences: 64
  wt103_hard_stop_pct: 5.0

  runs_dir: runs
  eval_every: 20
  save_every: 999999
  log_every: 10
  early_stopping_patience: 2

  # Filled in by overnight pipeline after SFT v5 completes.
  base_checkpoint: runs/run_20260427_230323_sft/checkpoints/best_step_0001500_epoch_01_valloss_2p4115.pt
  device: auto
  torch_compile: true
