model:
  vocab_size: 50258
  pad_token_id: 50257
  bos_token_id: 50256
  eos_token_id: 50256
  d_model: 384
  n_layers: 14
  n_heads: 6
  d_ff: 768
  context_length: 1024
  bias: false
  dropout: 0.0151
  rope_theta: 10000.0
  gradient_checkpointing: false

logging:
  console_level: INFO
  file_level: DEBUG
  components:
    posttraining: INFO
    training: INFO

inference:
  device: auto
  max_tokens: 128
  temperature: 0.2
  top_k: 50
  top_p: 0.9

chat:
  device: auto
  max_tokens: 40
  temperature: 0.0
  top_k: 50
  top_p: 0.9
  system_prompt: "You are ParrotLLM, a helpful assistant."
  checkpoint_dir: runs/posttraining/sft_final_large_alpaca

sft:
  device: auto
  base_checkpoint: runs/posttraining/base_import/run_20260410_044337/checkpoints/best_loss_3p2650_epoch_0000_step_0095500.pt
  cache_dir: data/posttraining/hf_cache
  raw_dir: data/posttraining/raw
  prepared_dir: data/posttraining/sft_mix_final_large_alpaca
  runs_dir: runs/posttraining/sft_final_large_alpaca
  checkpoint_dir: checkpoints
  system_prompt: "You are ParrotLLM, a helpful assistant."
  max_seq_length: 1024
  train_batch_size: 8
  eval_batch_size: 8
  gradient_accumulation_steps: 4
  learning_rates:
    - 5.0e-7
  min_lr_ratio: 0.5
  warmup_ratio: 0.03
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  z_loss_coeff: 0.0
  replay_ratio: 0.1
  replay_train_bin: data/processed/train.bin
  replay_val_bin: data/processed/val.bin
  num_epochs: 4.0
  polish_epochs: 0.0
  polish_subset_size: 4000
  save_every: 10
  eval_every: 50
  early_stopping_metric: format_score
  early_stopping_mode: max
  early_stopping_target: 0.875
  early_stopping_patience: 4
  early_stopping_min_delta: 0.0
  keep_last_checkpoints: 4
  keep_best_checkpoints: 3
  log_every: 1
  seed: 42
  compile: false
  format_score_weight: 0.25
  forgetting_penalty_weight: 0.08
  prompt_suite_path: configs/posttraining/dev_prompt_suite_final_sft.jsonl
  log_prompt_suite_generations: true
  sources:
    - name: alpaca_instruction
      loader: alpaca
      path: tatsu-lab/alpaca
      split: train
      target_examples: 8000
      candidate_multiplier: 3
      language: en
      min_turns: 2
      max_turns: 2
      quality_weight: 1.1
      tags: [alpaca, instruction_following]
      rationale: Larger Alpaca sample for broader instruction-response behavior with fewer repeated epochs.
    - name: mcq_format
      loader: local_jsonl
      path: data/posttraining/custom/final_mcq_format.jsonl
      split: train
      target_examples: 50
      candidate_multiplier: 1
      language: en
      min_turns: 2
      max_turns: 2
      quality_weight: 1.2
      tags: [multiple_choice, format_following]
      rationale: Generic non-benchmark MCQ examples that teach letter-only A/B/C/D responses.
  decontam_datasets:
    - name: wikitext103_test
      loader: local_disk
      path: data/wikitext-103-test
      field: text
      split: test
    - name: nlp26_owt_eval
      loader: local_disk
      path: data/owt-eval/NLP26/NLP26_OWT_eval/test
      field: text
      split: test
    - name: hellaswag
      loader: huggingface
      path: Rowan/hellaswag
      field: ctx
      split: validation
    - name: winogrande
      loader: huggingface
      path: allenai/winogrande
      subset: winogrande_xl
      field: sentence
      split: validation
    - name: openbookqa
      loader: huggingface
      path: allenai/openbookqa
      subset: main
      field: question_stem
      split: validation
    - name: lambada
      loader: huggingface
      path: EleutherAI/lambada_openai
      field: text
      split: test
