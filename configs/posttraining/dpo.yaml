model:
  vocab_size: 50258
  pad_token_id: 50257
  bos_token_id: 50256
  eos_token_id: 50256
  d_model: 384
  n_layers: 14
  n_heads: 6
  d_ff: 768
  context_length: 1024
  bias: false
  dropout: 0.0
  rope_theta: 10000.0
  gradient_checkpointing: false

logging:
  console_level: INFO
  file_level: DEBUG
  components:
    posttraining: INFO
    training: INFO

dpo:
  device: auto
  reference_checkpoint: runs/posttraining/sft_alpaca/run_20260430_191324_sft_lr_2e-05/checkpoints/best_loss_2p7847_epoch_0000_step_0000200.pt
  cache_dir: data/posttraining/hf_cache
  raw_dir: data/posttraining/dpo_raw
  prepared_dir: data/posttraining/dpo_pairs
  runs_dir: runs/posttraining/dpo
  system_prompt: "You are ParrotLLM, a helpful assistant."
  max_seq_length: 1024

  beta: 0.1
  learning_rate: 5.0e-7
  num_epochs: 1.0
  train_batch_size: 4
  gradient_accumulation_steps: 1
  warmup_ratio: 0.03
  min_lr_ratio: 0.1
  weight_decay: 0.0
  beta1: 0.9
  beta2: 0.999
  grad_clip: 1.0
  seed: 42

  save_every: 200
  eval_every: 100
  log_every: 1
  keep_last_checkpoints: 2
  keep_best_checkpoints: 2

  dev_pairs: 500

  sources:
    - name: hh_rlhf_helpful_base
      path: Anthropic/hh-rlhf
      subset: helpful-base
      split: train
      target_pairs: 6000
      language: en
    - name: hh_rlhf_helpful_rejection_sampled
      path: Anthropic/hh-rlhf
      subset: helpful-rejection-sampled
      split: train
      target_pairs: 4000
      language: en

  decontam_datasets:
    - name: wikitext103_test
      loader: local_disk
      path: data/wikitext-103-test
      field: text
      split: test
    - name: nlp26_owt_eval
      loader: local_disk
      path: data/owt-eval/NLP26/NLP26_OWT_eval/test
      field: text
      split: test
    - name: hellaswag
      loader: huggingface
      path: Rowan/hellaswag
      field: ctx
      split: validation
    - name: winogrande
      loader: huggingface
      path: allenai/winogrande
      subset: winogrande_xl
      field: sentence
      split: validation
    - name: openbookqa
      loader: huggingface
      path: allenai/openbookqa
      subset: main
      field: question_stem
      split: validation
    - name: lambada
      loader: huggingface
      path: EleutherAI/lambada_openai
      field: text
      split: test
