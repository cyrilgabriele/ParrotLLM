model:
  vocab_size: 50258
  pad_token_id: 50257
  bos_token_id: 50256
  eos_token_id: 50256
  d_model: 384
  n_layers: 14
  n_heads: 6
  d_ff: 768
  context_length: 1024
  bias: false
  dropout: 0.0151
  rope_theta: 10000.0
  gradient_checkpointing: false
logging:
  console_level: INFO
  file_level: DEBUG
  components:
    posttraining: INFO
    training: INFO
inference:
  device: auto
  max_tokens: 128
  temperature: 0.2
  top_k: 50
  top_p: 0.9
chat:
  device: auto
  max_tokens: 40
  temperature: 0.0
  top_k: 50
  top_p: 0.9
  system_prompt: You are ParrotLLM, a helpful assistant.
  checkpoint_dir: runs/posttraining/sft_benchmark
sft:
  device: auto
  base_checkpoint: runs/posttraining/base_import/run_20260410_044337/checkpoints/best_loss_3p2650_epoch_0000_step_0095500.pt
  cache_dir: data/posttraining/hf_cache
  raw_dir: data/posttraining/raw
  prepared_dir: data/posttraining/sft_mix_benchmark
  runs_dir: runs/posttraining/sft_benchmark
  checkpoint_dir: checkpoints
  system_prompt: You are ParrotLLM, a helpful assistant.
  template_format: alpaca
  max_seq_length: 1024
  train_batch_size: 8
  eval_batch_size: 8
  gradient_accumulation_steps: 4
  learning_rates:
  - 5.0e-07
  min_lr_ratio: 0.5
  warmup_ratio: 0.03
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  z_loss_coeff: 0.0
  replay_ratio: 0.0
  replay_train_bin: data/processed/train.bin
  replay_val_bin: data/processed/val.bin
  num_epochs: 1.5
  polish_epochs: 0.0
  polish_subset_size: 4000
  save_every: 50
  eval_every: 100
  early_stopping_metric: composite_score
  early_stopping_mode: max
  early_stopping_patience: 4
  keep_last_checkpoints: 4
  keep_best_checkpoints: 3
  log_every: 1
  seed: 42
  compile: false
  format_score_weight: 0.25
  forgetting_penalty_weight: 0.08
  prompt_suite_path: configs/posttraining/dev_prompt_suite_final_sft.jsonl
  log_prompt_suite_generations: true
  sources:
  - name: hellaswag_train
    loader: hellaswag
    path: Rowan/hellaswag
    split: train
    target_examples: 50
    candidate_multiplier: 2
    quality_weight: 1.3
    tags:
    - tier1
    - multiple_choice
    - hellaswag
    rationale: Direct task match for the leaderboard HellaSwag benchmark.
  - name: winogrande_train
    loader: winogrande
    path: allenai/winogrande
    subset: winogrande_xl
    split: train
    target_examples: 50
    candidate_multiplier: 2
    quality_weight: 1.3
    tags:
    - tier1
    - multiple_choice
    - winogrande
    - binary
    rationale: Direct task match for the leaderboard WinoGrande benchmark.
  - name: openbookqa_train
    loader: openbookqa
    path: allenai/openbookqa
    subset: main
    split: train
    target_examples: 50
    candidate_multiplier: 2
    quality_weight: 1.3
    tags:
    - tier1
    - multiple_choice
    - openbookqa
    rationale: Tiny but exact format; oversample 5x.
  - name: ai2_arc_easy_train
    loader: ai2_arc
    path: allenai/ai2_arc
    subset: ARC-Easy
    split: train
    target_examples: 50
    candidate_multiplier: 2
    quality_weight: 1.2
    tags:
    - tier1
    - multiple_choice
    - arc
  - name: ai2_arc_challenge_train
    loader: ai2_arc
    path: allenai/ai2_arc
    subset: ARC-Challenge
    split: train
    target_examples: 50
    candidate_multiplier: 2
    quality_weight: 1.25
    tags:
    - tier1
    - multiple_choice
    - arc
  - name: sciq_train
    loader: sciq
    path: allenai/sciq
    split: train
    target_examples: 50
    candidate_multiplier: 2
    quality_weight: 1.15
    tags:
    - tier1
    - multiple_choice
    - sciq
    - science
  - name: commonsense_qa_train
    loader: commonsense_qa
    path: tau/commonsense_qa
    split: train
    target_examples: 50
    candidate_multiplier: 2
    quality_weight: 1.1
    tags:
    - tier2
    - multiple_choice
    - csqa
  - name: mmlu_aux_train
    loader: mmlu
    path: cais/mmlu
    subset: auxiliary_train
    split: train
    target_examples: 50
    candidate_multiplier: 2
    quality_weight: 1.0
    tags:
    - tier5
    - multiple_choice
    - mmlu
  decontam_datasets:
  - name: wikitext103_test
    loader: local_disk
    path: data/wikitext-103-test
    field: text
    split: test
  - name: nlp26_owt_eval
    loader: local_disk
    path: data/owt-eval/NLP26/NLP26_OWT_eval/test
    field: text
    split: test
  - name: hellaswag_val
    loader: huggingface
    path: Rowan/hellaswag
    field: ctx
    split: validation
  - name: winogrande_val
    loader: huggingface
    path: allenai/winogrande
    subset: winogrande_xl
    field: sentence
    split: validation
  - name: openbookqa_val
    loader: huggingface
    path: allenai/openbookqa
    subset: main
    field: question_stem
    split: validation
  - name: lambada_test
    loader: huggingface
    path: EleutherAI/lambada_openai
    field: text
    split: test
