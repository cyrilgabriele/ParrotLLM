model:
  vocab_size: 50258
  pad_token_id: 50257
  bos_token_id: 50256
  eos_token_id: 50256
  d_model: 384
  n_layers: 14
  n_heads: 6
  d_ff: 768
  context_length: 1024
  bias: false
  dropout: 0.0151
  rope_theta: 10000.0
  gradient_checkpointing: false

logging:
  console_level: INFO
  file_level: DEBUG
  components:
    posttraining: INFO
    training: INFO

inference:
  device: auto
  max_tokens: 128
  temperature: 0.2
  top_k: 50
  top_p: 0.9

chat:
  device: auto
  max_tokens: 256
  temperature: 0.7
  top_k: 50
  top_p: 0.9
  system_prompt: "You are ParrotLLM, a helpful assistant."
  checkpoint_dir: runs

# Experiment A: SFT teaches FORMAT ONLY (chat/instruction shape + LAMBADA
# narrative-completion shape). NO benchmark-shaped MC data is included here.
# DPO does the benchmark-specific work afterward (dpo_benchmark_shared.yaml).
sft:
  device: auto
  base_checkpoint: runs/posttraining/base_import/run_20260410_044337/checkpoints/best_loss_3p2650_epoch_0000_step_0095500.pt
  cache_dir: data/posttraining/hf_cache
  raw_dir: data/posttraining/raw
  prepared_dir: data/posttraining/sft_format_only
  runs_dir: runs/posttraining/sft_format_only
  checkpoint_dir: checkpoints
  system_prompt: "You are ParrotLLM, a helpful assistant."
  template_format: alpaca
  max_seq_length: 1024
  train_batch_size: 8
  eval_batch_size: 8
  gradient_accumulation_steps: 4
  learning_rates:
    - 5.0e-5
    - 1.0e-4
  min_lr_ratio: 0.1
  warmup_ratio: 0.03
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  z_loss_coeff: 0.0
  # Replay bumped from 0.05 -> 0.10 to protect base narrative perplexity
  # (LAMBADA needs base coherence). VL07 slide 25 catastrophic-forgetting
  # mitigation: "mix pretraining data with SFT data."
  replay_ratio: 0.10
  replay_train_bin: data/processed/train.bin
  replay_val_bin: data/processed/val.bin
  num_epochs: 3.0
  polish_epochs: 0.5
  polish_subset_size: 4000
  save_every: 10
  eval_every: 100
  keep_last_checkpoints: 3
  keep_best_checkpoints: 2
  log_every: 1
  seed: 42
  compile: false
  format_score_weight: 0.3
  forgetting_penalty_weight: 0.05
  prompt_suite_path: configs/posttraining/dev_prompt_suite_ifeval_lite.jsonl
  sources:
    # Chat / instruction-following: ~70% of mix (~7000 examples)
    - name: oasst1_ready
      loader: oasst1
      path: OpenAssistant/oasst1
      split: train
      target_examples: 3000
      candidate_multiplier: 3
      language: en
      use_best_branch: true
      require_tree_state: ready_for_export
      min_turns: 2
      max_turns: 4
      max_depth: 4
      quality_weight: 1.1
      tags: [chat, human_reviewed]
      rationale: Human-reviewed dialogue trees teaching the assistant format.
    - name: tulu_flan_v2
      loader: tulu
      path: allenai/tulu-3-sft-mixture
      split: train
      target_examples: 2500
      candidate_multiplier: 5
      language: en
      source_matches: [flan_v2, flan]
      min_turns: 2
      max_turns: 2
      quality_weight: 1.0
      tags: [short_answer, classification]
      rationale: Short-answer instruction tuning (no benchmark labels in train).
    - name: alpaca_cleaned
      loader: alpaca
      path: yahma/alpaca-cleaned
      split: train
      target_examples: 1500
      candidate_multiplier: 2
      language: en
      quality_weight: 1.0
      tags: [chat, instruction_following]
      rationale: Diverse instruction-following pairs (Alpaca template fit).

    # Narrative completion: 30% of mix (~3000 examples) — teaches LAMBADA shape
    # (passage ending mid-sentence -> next word) under the Alpaca wrapper.
    # TinyStories chosen over BookCorpusOpen to avoid LAMBADA-source overlap.
    - name: tinystories_lambada_shape
      loader: narrative_completion
      path: roneneldan/TinyStories
      split: train
      target_examples: 3000
      candidate_multiplier: 3
      language: en
      quality_weight: 1.0
      # Raw template (no Alpaca wrapper) so the model retains base-model
      # narrative-continuation behavior on free-floating LAMBADA passages.
      # Without this, full-Alpaca SFT teaches the model that any unwrapped
      # passage is an instruction to answer, which destroys LAMBADA accuracy.
      template_format: raw
      tags: [narrative, lambada_shape, raw]
      rationale: >
        LAMBADA-shape pairs (passage minus last word -> last word). Trained as
        raw text (no ### Instruction wrapper) so the model retains base-model
        narrative continuation behavior on free-floating passages.

  decontam_datasets:
    - name: wikitext103_test
      loader: local_disk
      path: data/wikitext-103-test
      field: text
      split: test
    - name: nlp26_owt_eval
      loader: local_disk
      path: data/owt-eval/NLP26/NLP26_OWT_eval/test
      field: text
      split: test
    - name: hellaswag
      loader: huggingface
      path: Rowan/hellaswag
      field: ctx
      split: validation
    - name: winogrande
      loader: huggingface
      path: allenai/winogrande
      subset: winogrande_xl
      field: sentence
      split: validation
    - name: openbookqa
      loader: huggingface
      path: allenai/openbookqa
      subset: main
      field: question_stem
      split: validation
    - name: lambada
      loader: huggingface
      path: EleutherAI/lambada_openai
      field: text
      split: test
