model:
  vocab_size: 50258
  pad_token_id: 50257
  bos_token_id: 50256
  eos_token_id: 50256
  d_model: 384
  n_layers: 14
  n_heads: 6
  d_ff: 768
  context_length: 1024
  bias: false
  dropout: 0.0151
  rope_theta: 10000.0
  gradient_checkpointing: false

logging:
  console_level: INFO
  file_level: DEBUG
  components:
    posttraining: INFO
    training: INFO

sft:
  device: auto
  base_checkpoint: runs/posttraining/base_import/run_20260410_044337/checkpoints/best_loss_3p2650_epoch_0000_step_0095500.pt
  cache_dir: data/posttraining/hf_cache
  raw_dir: data/posttraining/raw
  prepared_dir: data/posttraining/sft_mix_smoke
  runs_dir: runs/posttraining/sft_smoke
  checkpoint_dir: checkpoints
  system_prompt: "You are ParrotLLM, a helpful assistant."
  max_seq_length: 1024
  train_batch_size: 2
  eval_batch_size: 2
  gradient_accumulation_steps: 1
  learning_rates:
    - 1.0e-4
  min_lr_ratio: 0.1
  warmup_ratio: 0.03
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  z_loss_coeff: 0.0
  replay_ratio: 0.0
  replay_train_bin: data/processed/train.bin
  replay_val_bin: data/processed/val.bin
  num_epochs: 0.1
  polish_epochs: 0.1
  polish_subset_size: 8
  save_every: 1
  eval_every: 1
  keep_last_checkpoints: 1
  keep_best_checkpoints: 1
  log_every: 1
  seed: 42
  compile: false
  format_score_weight: 0.1
  forgetting_penalty_weight: 0.05
  prompt_suite_path: configs/posttraining/dev_prompt_suite_smoke.jsonl
  sources:
    - name: wildchat_gpt4
      loader: wildchat
      path: allenai/WildChat
      split: train
      target_examples: 8
      candidate_multiplier: 2
      language: en
      require_model_substring: gpt-4
      exclude_toxic: true
      exclude_redacted: true
      min_turns: 2
      max_turns: 6
      quality_weight: 1.0
      tags: [chat, multi_turn]
      rationale: Smoke-test chat slice.
    - name: oasst1_ready
      loader: oasst1
      path: OpenAssistant/oasst1
      split: train
      target_examples: 6
      candidate_multiplier: 2
      language: en
      use_best_branch: true
      require_tree_state: ready_for_export
      min_turns: 2
      max_turns: 4
      max_depth: 4
      quality_weight: 1.1
      tags: [chat, human_reviewed]
      rationale: Smoke-test human-reviewed chat slice.
    - name: tulu_flan_v2
      loader: tulu
      path: allenai/tulu-3-sft-mixture
      split: train
      target_examples: 8
      candidate_multiplier: 2
      language: en
      source_matches: [flan_v2, flan]
      min_turns: 2
      max_turns: 2
      quality_weight: 1.0
      tags: [short_answer, classification]
      rationale: Smoke-test exact-answer slice.
    - name: tulu_persona_if
      loader: tulu
      path: allenai/tulu-3-sft-mixture
      split: train
      target_examples: 6
      candidate_multiplier: 2
      language: en
      source_matches: [personahub_ifdata_manual_seed_v3_29980]
      min_turns: 2
      max_turns: 2
      quality_weight: 1.0
      tags: [instruction_following]
      rationale: Smoke-test instruction-following slice.
    - name: tulu_persona_reasoning
      loader: tulu
      path: allenai/tulu-3-sft-mixture
      split: train
      target_examples: 4
      candidate_multiplier: 2
      language: en
      source_matches:
        - tulu_v3.9_open_math_2_gsm8k_50k
        - tulu_v3.9_personahub_math_interm_algebra_20k
      min_turns: 2
      max_turns: 2
      quality_weight: 0.95
      tags: [reasoning]
      rationale: Smoke-test reasoning slice.
    - name: tulu_structured_outputs
      loader: tulu
      path: allenai/tulu-3-sft-mixture
      split: train
      target_examples: 4
      candidate_multiplier: 2
      language: en
      source_matches: [tablegpt, flan]
      min_turns: 2
      max_turns: 2
      quality_weight: 1.0
      tags: [json, extraction]
      rationale: Smoke-test structured-output slice.
    - name: pku_safe_rlhf_refusals
      loader: pku_safe_rlhf_qa
      path: PKU-Alignment/PKU-SafeRLHF-QA
      split: train
      target_examples: 4
      candidate_multiplier: 2
      language: en
      keep_harmful_only: true
      min_turns: 2
      max_turns: 2
      quality_weight: 1.0
      tags: [safety, refusal]
      rationale: Smoke-test safety slice.
  decontam_datasets:
    - name: wikitext103_test
      loader: local_disk
      path: data/wikitext-103-test
      field: text
      split: test
    - name: nlp26_owt_eval
      loader: local_disk
      path: data/owt-eval/NLP26/NLP26_OWT_eval/test
      field: text
      split: test
