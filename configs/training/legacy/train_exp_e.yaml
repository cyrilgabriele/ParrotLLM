# Full training on Dataset C with tuned architecture + best hyperparameters
# Architecture: from 8.75M→17.5M architecture search
# Hyperparameters: from Trial 10 of 40M HP tuning (ppl=51.4)
# Run with: python main.py --stage train --config configs/training/train_exp_e.yaml

model:
  vocab_size: 50258
  pad_token_id: 50257
  bos_token_id: 50256
  eos_token_id: 50256
  d_model: 384
  n_layers: 14
  n_heads: 6
  d_ff: 768
  context_length: 1024
  bias: false
  dropout: 0.0591
  rope_theta: 10000.0
  gradient_checkpointing: false

training:
  device: auto
  train_bin: data/exp_e/train.bin
  val_bin: data/exp_e/val.bin
  num_workers: 4
  pin_memory: true

  batch_size: 64
  gradient_accumulation_steps: 4

  learning_rate: 8.672e-4
  min_lr: 8.672e-5
  weight_decay: 0.0544
  beta1: 0.9
  beta2: 0.9943
  grad_clip: 1.6858

  warmup_steps: 450
  max_steps: 100000
  lr_schedule: wsd
  lr_decay_ratio: 0.1758
  z_loss_coeff: 3.821e-4

  compile: true
  save_every: 5000
  eval_every: 500
  checkpoint_dir: checkpoints
  keep_last_checkpoints: 10
  keep_best_checkpoints: 10
  early_stopping_patience: 8
  early_stopping_min_delta: 0.001

  runs_dir: runs/exp_e
  log_every: 10

logging:
  console_level: INFO
  file_level: DEBUG
  components:
    data_preprocessing: DEBUG
    model_initialization: INFO
    training: INFO

eval:
  device: auto
  batch_size: 32
  max_sequences: 512
  datasets:
    - name: wikitext
      path: wikitext
      subset: wikitext-103-raw-v1
      split: test
    - name: exp_e_val
      path: data/exp_e/val.bin
