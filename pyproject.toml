[project]
name = "parrotllm"
version = "0.1.0"
description = "Code of ParrotLLM group of the NLP course @ HSG"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "torch>=2.6.0",
    "transformers>=4.48.0",
    "datasets>=3.0.0",
    "numpy>=2.0.0",
    "matplotlib>=3.9.0",
    "tqdm>=4.66.0",
    "wandb>=0.19.0",
    "pyyaml>=6.0",
    "gradio>=5.0.0",
    "ipykernel>=7.2.0",
    "pydantic>=2.12.5",
    "torchinfo>=1.8.0",
    "optuna>=4.0.0",
    "python-dotenv>=1.2.2",
    "psutil>=6.0.0",
    "nvidia-ml-py>=12.0",
    "ipywidgets>=8.0",
    "rich>=13.0",
]

[project.optional-dependencies]
classifier = ["kenlm>=0.2.0"]
preprocessing = ["fasttext-wheel>=0.9.2"]

[project.scripts]
parrotllm = "main:main"

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
